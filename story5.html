<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#171029">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Հարութի Պատմ.">
<title>5-րդ պատմություն</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Armenian:wght@600;700;900&family=Noto+Sans+Armenian:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --night-deep:  #171029;
    --night-mid:   #241a45;
    --night-plum:  #322150;
    --cream:       #F7EFDC;
    --amber:       #F2A65A;
    --sage:        #8FB996;
    --berry:       #DD7295;
    --sky:         #6FA8DC;
    --ink:         #241A3D;
  }

  *{ box-sizing:border-box; }

  html,body{ margin:0; min-height:100vh; }

  body{
    font-family:'Noto Sans Armenian','Segoe UI',system-ui,sans-serif;
    line-height:1.5;
    color:var(--cream);
    background:
      radial-gradient(ellipse 900px 560px at 84% 4%, rgba(242,166,90,0.16), transparent 60%),
      linear-gradient(-45deg, var(--night-deep), var(--night-plum), var(--night-mid), var(--night-plum));
    background-size:100% 100%, 380% 380%;
    animation:auroraShift 26s ease infinite;
    overflow-x:hidden;
    position:relative;
    padding:24px 16px 48px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  @keyframes auroraShift{
    0%{ background-position:0% 0%, 0% 50%; }
    50%{ background-position:0% 0%, 100% 50%; }
    100%{ background-position:0% 0%, 0% 50%; }
  }

  .stars{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    opacity:0.55;
    background-image:
      radial-gradient(1.6px 1.6px at 40px 60px, var(--cream), transparent),
      radial-gradient(1.2px 1.2px at 130px 140px, var(--cream), transparent),
      radial-gradient(1.8px 1.8px at 200px 40px, var(--cream), transparent),
      radial-gradient(1.2px 1.2px at 70px 190px, var(--cream), transparent),
      radial-gradient(1.5px 1.5px at 240px 210px, var(--cream), transparent),
      radial-gradient(1.3px 1.3px at 170px 90px, var(--cream), transparent),
      radial-gradient(1.4px 1.4px at 300px 260px, var(--cream), transparent),
      radial-gradient(1.1px 1.1px at 20px 300px, var(--cream), transparent),
      radial-gradient(1.7px 1.7px at 340px 60px, var(--cream), transparent),
      radial-gradient(1.3px 1.3px at 260px 130px, var(--cream), transparent);
    background-repeat:repeat;
    background-size:360px 360px;
    animation:twinkle 6s ease-in-out infinite alternate;
  }
  .stars2{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    opacity:0.35;
    background-image:
      radial-gradient(2px 2px at 90px 20px, #fff, transparent),
      radial-gradient(1.5px 1.5px at 220px 160px, #fff, transparent),
      radial-gradient(2.2px 2.2px at 320px 300px, #fff, transparent),
      radial-gradient(1.6px 1.6px at 60px 250px, #fff, transparent),
      radial-gradient(1.8px 1.8px at 180px 70px, #fff, transparent);
    background-repeat:repeat;
    background-size:400px 400px;
    animation:twinkle 4.5s ease-in-out infinite alternate-reverse;
  }
  @keyframes twinkle{
    0%{ opacity:0.25; }
    100%{ opacity:0.65; }
  }

  .moon{
    position:fixed;
    top:30px;
    right:9%;
    width:52px;
    height:52px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #fff8e8, var(--amber) 72%);
    box-shadow:0 0 42px 12px rgba(242,166,90,0.28);
    z-index:0;
    pointer-events:none;
    animation:moonFloat 9s ease-in-out infinite;
  }
  @keyframes moonFloat{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-8px); }
  }

  .planet{
    position:fixed;
    border-radius:50%;
    z-index:0;
    pointer-events:none;
    opacity:0.85;
  }
  .planet-1{
    top:16%;
    left:6%;
    width:22px;
    height:22px;
    background:radial-gradient(circle at 32% 30%, #b7e0c4, var(--sage) 70%);
    box-shadow:0 0 16px 4px rgba(143,185,150,0.35);
    animation:driftA 12s ease-in-out infinite;
  }
  .planet-2{
    bottom:22%;
    right:7%;
    width:16px;
    height:16px;
    background:radial-gradient(circle at 32% 30%, #f3b3cd, var(--berry) 70%);
    box-shadow:0 0 14px 4px rgba(221,114,149,0.35);
    animation:driftB 10s ease-in-out infinite;
  }
  .planet-3{
    top:55%;
    left:3%;
    width:12px;
    height:12px;
    background:radial-gradient(circle at 32% 30%, #cfe4f7, var(--sky) 70%);
    box-shadow:0 0 12px 3px rgba(111,168,220,0.35);
    animation:driftA 15s ease-in-out infinite reverse;
  }
  .planet-4{
    top:10%;
    right:20%;
    width:9px;
    height:9px;
    background:radial-gradient(circle at 32% 30%, #ffe3b8, var(--amber) 70%);
    box-shadow:0 0 10px 3px rgba(242,166,90,0.35);
    animation:driftB 8s ease-in-out infinite reverse;
  }
  @keyframes driftA{
    0%,100%{ transform:translate(0,0); }
    50%{ transform:translate(10px,-14px); }
  }
  @keyframes driftB{
    0%,100%{ transform:translate(0,0); }
    50%{ transform:translate(-12px,10px); }
  }

  .back-link{
    position:relative;
    z-index:1;
    align-self:flex-start;
    display:inline-flex;
    align-items:center;
    gap:6px;
    color:var(--cream);
    text-decoration:none;
    font-weight:600;
    font-size:0.9rem;
    opacity:0.75;
    margin-bottom:22px;
    padding:8px 16px;
    border:1px solid rgba(247,239,220,0.25);
    border-radius:20px;
    transition:opacity .25s ease, background .25s ease, transform .25s ease;
  }
  .back-link:hover,
  .back-link:focus-visible{
    opacity:1;
    background:rgba(247,239,220,0.08);
    transform:translateX(-3px);
  }

  h1{
    position:relative;
    z-index:1;
    font-family:'Noto Serif Armenian', serif;
    font-weight:900;
    font-size:clamp(1.6rem, 5vw, 2.2rem);
    margin:0 0 28px;
    text-align:center;
    color:var(--cream);
    text-shadow:0 0 24px rgba(242,166,90,0.3);
  }

  .gallery{
    position:relative;
    z-index:1;
    display:flex;
    flex-wrap:nowrap;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    gap:15px;
    padding:15px;
    background:rgba(36,26,61,0.55);
    border:1px solid rgba(247,239,220,0.12);
    backdrop-filter:blur(6px);
    border-radius:14px;
    max-width:95%;
    margin-bottom:30px;
    box-shadow:0 12px 28px rgba(0,0,0,0.35);
  }
  .gallery img{
    height:400px;
    object-fit:contain;
    border-radius:8px;
    border:1px solid rgba(247,239,220,0.2);
    background:rgba(0,0,0,0.15);
    cursor:zoom-in;
    transition:transform .25s ease, border-color .25s ease;
  }
  .gallery img:hover{
    transform:translateY(-4px) scale(1.015);
    border-color:var(--amber);
  }
  .gallery::-webkit-scrollbar{ height:8px; }
  .gallery::-webkit-scrollbar-thumb{ background:var(--amber); border-radius:8px; }
  .gallery::-webkit-scrollbar-track{ background:rgba(247,239,220,0.08); border-radius:8px; }

  .audio-section{
    position:relative;
    z-index:1;
    background:rgba(36,26,61,0.55);
    border:1px solid rgba(247,239,220,0.12);
    backdrop-filter:blur(6px);
    padding:20px;
    border-radius:14px;
    box-shadow:0 12px 28px rgba(0,0,0,0.35);
    text-align:center;
    width:100%;
    max-width:500px;
  }
  .audio-section p{
    margin-top:0;
    font-weight:700;
    font-family:'Noto Serif Armenian', serif;
    color:var(--amber);
  }
  audio{
    width:100%;
    border-radius:8px;
  }

  a:focus-visible{
    outline:2px solid var(--cream);
    outline-offset:3px;
  }

  /* Lightbox */
  .lightbox{
    position:fixed;
    inset:0;
    z-index:10;
    background:rgba(10,7,20,0.92);
    backdrop-filter:blur(4px);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .lightbox.open{ display:flex; }
  .lightbox img{
    max-width:90vw;
    max-height:85vh;
    object-fit:contain;
    border-radius:10px;
    box-shadow:0 20px 60px rgba(0,0,0,0.6);
    border:1px solid rgba(247,239,220,0.15);
  }
  .lb-close{
    position:absolute;
    top:18px;
    right:22px;
    width:42px;
    height:42px;
    border-radius:50%;
    border:1px solid rgba(247,239,220,0.3);
    background:rgba(247,239,220,0.08);
    color:var(--cream);
    font-size:1.4rem;
    line-height:1;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:background .2s ease, transform .2s ease;
  }
  .lb-close:hover{ background:rgba(247,239,220,0.18); transform:scale(1.06); }
  .lb-nav{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:52px;
    height:52px;
    border-radius:50%;
    border:1px solid rgba(247,239,220,0.3);
    background:rgba(247,239,220,0.08);
    color:var(--cream);
    font-size:1.6rem;
    font-family:'Noto Sans Armenian', sans-serif;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:background .2s ease, transform .2s ease;
  }
  .lb-nav:hover{ background:var(--amber); color:var(--ink); }
  .lb-prev{ left:16px; }
  .lb-next{ right:16px; }
  .lb-counter{
    position:absolute;
    bottom:22px;
    left:50%;
    transform:translateX(-50%);
    font-size:0.85rem;
    font-weight:600;
    color:rgba(247,239,220,0.7);
    background:rgba(0,0,0,0.3);
    padding:4px 14px;
    border-radius:14px;
  }

  @media (max-width:640px){
    .lb-nav{ width:44px; height:44px; font-size:1.3rem; }
    .lb-prev{ left:6px; }
    .lb-next{ right:6px; }
  }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration:0.01ms !important;
      animation-iteration-count:1 !important;
      transition-duration:0.01ms !important;
    }
  }
</style>
</head>
<body>

<div class="stars" aria-hidden="true"></div>
<div class="stars2" aria-hidden="true"></div>
<div class="moon" aria-hidden="true"></div>
<div class="planet planet-1" aria-hidden="true"></div>
<div class="planet planet-2" aria-hidden="true"></div>
<div class="planet planet-3" aria-hidden="true"></div>
<div class="planet planet-4" aria-hidden="true"></div>

<a href="index.html" class="back-link">⬅ Հետ դեպի գլխավոր էջ</a>

<h1>5-րդ պատմություն</h1>

<div class="gallery" id="gallery">
        <img src="5_1.jpg" alt="Նկար 1">
        <img src="5_2.jpg" alt="Նկար 2">
        <img src="5_3.jpg" alt="Նկար 3">
        <img src="5_4.jpg" alt="Նկար 4">
        <img src="5_5.jpg" alt="Նկար 5">
        <img src="5_6.jpg" alt="Նկար 6">
        <img src="5_7.jpg" alt="Նկար 7">
        <img src="5_8.jpg" alt="Նկար 8">
        <img src="5_9.jpg" alt="Նկար 9">
        <img src="5_10.jpg" alt="Նկար 10">
        <img src="5_11.jpg" alt="Նկար 11">
        <img src="5_12.jpg" alt="Նկար 12">
        <img src="5_13.jpg" alt="Նկար 13">
        <img src="5_14.jpg" alt="Նկար 14">
        <img src="5_15.jpg" alt="Նկար 15">
        <img src="5_16.jpg" alt="Նկար 16">
        <img src="5_17.jpg" alt="Նկար 17">
</div>

<div class="audio-section">
    <p>🎵 Լսել ձայնագրությունը</p>
    <audio controls>
        <source src="patm5.m4a" type="audio/x-m4a">
    </audio>
</div>

<div class="lightbox" id="lightbox">
  <button class="lb-close" id="lbClose" aria-label="Փակել">✕</button>
  <button class="lb-nav lb-prev" id="lbPrev" aria-label="Նախորդ">‹</button>
  <img id="lbImg" src="" alt="">
  <button class="lb-nav lb-next" id="lbNext" aria-label="Հաջորդ">›</button>
  <div class="lb-counter" id="lbCounter"></div>
</div>

<script>
(function(){
  var gallery = document.getElementById('gallery');
  var imgs = Array.prototype.slice.call(gallery.querySelectorAll('img'));
  var lightbox = document.getElementById('lightbox');
  var lbImg = document.getElementById('lbImg');
  var lbCounter = document.getElementById('lbCounter');
  var current = 0;

  function show(index){
    current = (index + imgs.length) % imgs.length;
    lbImg.src = imgs[current].src;
    lbImg.alt = imgs[current].alt;
    lbCounter.textContent = (current + 1) + ' / ' + imgs.length;
  }

  function openLightbox(index){
    show(index);
    lightbox.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeLightbox(){
    lightbox.classList.remove('open');
    document.body.style.overflow = '';
  }

  imgs.forEach(function(img, i){
    img.addEventListener('click', function(){ openLightbox(i); });
  });

  document.getElementById('lbClose').addEventListener('click', closeLightbox);
  document.getElementById('lbPrev').addEventListener('click', function(){ show(current - 1); });
  document.getElementById('lbNext').addEventListener('click', function(){ show(current + 1); });

  lightbox.addEventListener('click', function(e){
    if(e.target === lightbox){ closeLightbox(); }
  });

  document.addEventListener('keydown', function(e){
    if(!lightbox.classList.contains('open')) return;
    if(e.key === 'Escape') closeLightbox();
    if(e.key === 'ArrowLeft') show(current - 1);
    if(e.key === 'ArrowRight') show(current + 1);
  });
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
