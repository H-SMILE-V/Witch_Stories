<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#171029">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Հարութի Պատմ.">
<meta name="description" content="Հարութի Պատմությունները — բացիր ամբողջ գիրքը կամ ընտրիր առանձին պատմություն։">
<title>Հարութի Պատմությունները</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Armenian:wght@600;700;900&family=Noto+Sans+Armenian:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --night-deep:  #171029;
    --night-mid:   #241a45;
    --night-plum:  #322150;
    --cream:       #F7EFDC;
    --amber:       #F2A65A;
    --sage:        #8FB996;
    --berry:       #DD7295;
    --ink:         #241A3D;
  }

  *{ box-sizing:border-box; }

  html,body{ margin:0; min-height:100vh; }

  body{
    font-family:'Noto Sans Armenian','Segoe UI',system-ui,sans-serif;
    line-height:1.5;
    color:var(--cream);
    background:
      radial-gradient(ellipse 900px 560px at 84% 4%, rgba(242,166,90,0.16), transparent 60%),
      linear-gradient(-45deg, var(--night-deep), var(--night-plum), var(--night-mid), var(--night-plum));
    background-size:100% 100%, 380% 380%;
    animation:auroraShift 26s ease infinite;
    overflow-x:hidden;
    position:relative;
  }

  @keyframes auroraShift{
    0%{ background-position:0% 0%, 0% 50%; }
    50%{ background-position:0% 0%, 100% 50%; }
    100%{ background-position:0% 0%, 0% 50%; }
  }

  .stars{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    opacity:0.5;
    background-image:
      radial-gradient(1.6px 1.6px at 40px 60px, var(--cream), transparent),
      radial-gradient(1.2px 1.2px at 130px 140px, var(--cream), transparent),
      radial-gradient(1.8px 1.8px at 200px 40px, var(--cream), transparent),
      radial-gradient(1.2px 1.2px at 70px 190px, var(--cream), transparent),
      radial-gradient(1.5px 1.5px at 240px 210px, var(--cream), transparent),
      radial-gradient(1.3px 1.3px at 170px 90px, var(--cream), transparent);
    background-repeat:repeat;
    background-size:260px 260px;
    animation:twinkle 6s ease-in-out infinite alternate;
  }
  @keyframes twinkle{
    0%{ opacity:0.28; }
    100%{ opacity:0.6; }
  }

  .moon{
    position:absolute;
    top:36px;
    right:8%;
    width:60px;
    height:60px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #fff8e8, var(--amber) 72%);
    box-shadow:0 0 46px 13px rgba(242,166,90,0.28);
    z-index:0;
    pointer-events:none;
  }

  main{
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    max-width:760px;
    margin:0 auto;
    padding:64px 20px 72px;
    text-align:center;
  }

  .book-scene{
    position:relative;
    width:200px;
    height:136px;
    margin-bottom:14px;
    animation:bookFloat 7s ease-in-out infinite;
  }
  @keyframes bookFloat{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-9px); }
  }
  .book-glow{
    position:absolute;
    inset:-42px;
    background:radial-gradient(circle, rgba(242,166,90,0.4), transparent 65%);
    filter:blur(4px);
    animation:glowPulse 4s ease-in-out infinite;
  }
  @keyframes glowPulse{
    0%,100%{ opacity:0.7; }
    50%{ opacity:1; }
  }
  .book-svg{ position:relative; z-index:1; width:100%; height:100%; display:block; }

  h1{
    font-family:'Noto Serif Armenian', serif;
    font-weight:900;
    font-size:clamp(1.85rem, 5vw, 2.6rem);
    line-height:1.25;
    margin:8px 0 6px;
    letter-spacing:0.3px;
    color:var(--cream);
    text-shadow:0 0 24px rgba(242,166,90,0.3);
  }

  .pdf-link{
    position:relative;
    display:inline-flex;
    align-items:center;
    gap:10px;
    margin:28px 0 48px;
    padding:15px 32px 17px;
    background:linear-gradient(135deg, var(--amber), var(--berry));
    color:var(--ink);
    text-decoration:none;
    font-family:'Noto Serif Armenian', serif;
    font-weight:700;
    font-size:1.02rem;
    border-radius:8px 8px 3px 3px;
    box-shadow:0 12px 26px rgba(221,114,149,0.32);
    transition:transform .25s ease, box-shadow .25s ease;
  }
  .pdf-link::after{
    content:"";
    position:absolute;
    left:50%;
    bottom:-11px;
    transform:translateX(-50%);
    width:0; height:0;
    border-left:13px solid transparent;
    border-right:13px solid transparent;
    border-top:11px solid var(--berry);
  }
  .pdf-link:hover,
  .pdf-link:focus-visible{
    transform:translateY(-4px) scale(1.02);
    box-shadow:0 18px 32px rgba(221,114,149,0.45);
  }

  .eyebrow{
    font-size:0.78rem;
    font-weight:700;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--sage);
    margin-bottom:18px;
    opacity:0.9;
  }

  .buttons-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:24px 16px;
    width:100%;
  }

  .story-btn{
    position:relative;
    text-decoration:none;
    padding:18px 8px 20px;
    border-radius:9px 9px 3px 3px;
    font-family:'Noto Sans Armenian', sans-serif;
    font-weight:700;
    font-size:0.9rem;
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:58px;
    box-shadow:0 8px 18px rgba(0,0,0,0.28);
    transition:transform .3s cubic-bezier(.175,.885,.32,1.275), box-shadow .3s ease;
  }
  .story-btn::after{
    content:"";
    position:absolute;
    left:50%;
    bottom:-8px;
    transform:translateX(-50%);
    width:0; height:0;
    border-left:9px solid transparent;
    border-right:9px solid transparent;
    border-top:8px solid inherit;
  }
  .story-btn .num{
    position:absolute;
    top:-9px;
    left:-9px;
    width:26px; height:26px;
    border-radius:50%;
    background:var(--ink);
    color:var(--cream);
    font-family:'Noto Serif Armenian', serif;
    font-weight:700;
    font-size:0.8rem;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 3px 8px rgba(0,0,0,0.4);
  }

  .story-btn:nth-child(3n+1){ background:var(--amber); transform:rotate(-1.5deg); }
  .story-btn:nth-child(3n+1)::after{ border-top-color:var(--amber); }
  .story-btn:nth-child(3n+2){ background:var(--sage); transform:rotate(1deg); }
  .story-btn:nth-child(3n+2)::after{ border-top-color:var(--sage); }
  .story-btn:nth-child(3n){ background:var(--berry); transform:rotate(-1deg); }
  .story-btn:nth-child(3n)::after{ border-top-color:var(--berry); }

  .story-btn:hover,
  .story-btn:focus-visible{
    transform:translateY(-6px) rotate(0deg) scale(1.04);
    box-shadow:0 16px 26px rgba(0,0,0,0.4);
  }
  .story-btn:active{ transform:translateY(-2px) scale(0.99); }

  .btn-center{ grid-column:2; }

  a:focus-visible{
    outline:2px solid var(--cream);
    outline-offset:3px;
    border-radius:4px;
  }

  .tagline{
    margin-top:52px;
    font-family:'Noto Serif Armenian', serif;
    font-weight:600;
    font-size:0.95rem;
    color:rgba(247,239,220,0.55);
    letter-spacing:0.3px;
  }

  @media (max-width:640px){
    .buttons-grid{ grid-template-columns:repeat(2, 1fr); gap:22px 14px; }
    .btn-center{ grid-column:span 2; }
    .book-scene{ width:160px; height:112px; }
    main{ padding:52px 18px 60px; }
    .pdf-link{ margin:24px 0 42px; }
  }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration:0.01ms !important;
      animation-iteration-count:1 !important;
      transition-duration:0.01ms !important;
    }
  }
</style>
</head>
<body>

<div class="stars" aria-hidden="true"></div>
<div class="moon" aria-hidden="true"></div>

<main>

  <div class="book-scene" aria-hidden="true">
    <div class="book-glow"></div>
    <svg class="book-svg" viewBox="0 0 220 150" xmlns="http://www.w3.org/2000/svg">
      <path d="M110 20 C 90 8, 40 5, 12 14 L12 118 C 40 109, 90 112, 110 124 Z" fill="#FBF3DE"/>
      <path d="M110 20 C 130 8, 180 5, 208 14 L208 118 C 180 109, 130 112, 110 124 Z" fill="#F3EAD2"/>
      <path d="M110 20 L110 124" stroke="#241A3D" stroke-width="1.5" opacity="0.15"/>
      <path d="M26 30 C 50 24, 80 26, 100 34" stroke="#DD7295" stroke-width="2.2" fill="none" stroke-linecap="round" opacity="0.55"/>
      <path d="M26 46 C 50 40, 80 42, 98 50" stroke="#8FB996" stroke-width="2.2" fill="none" stroke-linecap="round" opacity="0.55"/>
      <path d="M26 62 C 50 56, 78 58, 94 66" stroke="#F2A65A" stroke-width="2.2" fill="none" stroke-linecap="round" opacity="0.55"/>
      <path d="M120 34 C 140 26, 170 28, 194 34" stroke="#DD7295" stroke-width="2.2" fill="none" stroke-linecap="round" opacity="0.55"/>
      <path d="M122 50 C 142 44, 168 46, 192 50" stroke="#8FB996" stroke-width="2.2" fill="none" stroke-linecap="round" opacity="0.55"/>
      <path d="M124 66 C 142 60, 166 62, 188 66" stroke="#F2A65A" stroke-width="2.2" fill="none" stroke-linecap="round" opacity="0.55"/>
      <circle cx="160" cy="90" r="12" fill="#F2A65A" opacity="0.85"/>
      <path d="M160 84 l2.4 5 5.6 0.6 -4 4 1 5.6 -5 -2.8 -5 2.8 1 -5.6 -4 -4 5.6 -0.6 Z" fill="#FBF3DE"/>
    </svg>
  </div>

  <h1>Հարութի Պատմությունները</h1>

  <a class="pdf-link" href="Haruti girq.pdf" target="_blank" rel="noopener noreferrer">
    📖 Բացել «Haruti girq.pdf» գիրքը
  </a>

  <div class="eyebrow">Առանձին պատմություններ</div>

  <nav class="buttons-grid" aria-label="Պատմությունների ցանկ">
    <a href="story1.html" class="story-btn"><span class="num">1</span>1-ին պատմություն</a>
    <a href="story2.html" class="story-btn"><span class="num">2</span>2-րդ պատմություն</a>
    <a href="story3.html" class="story-btn"><span class="num">3</span>3-րդ պատմություն</a>
    <a href="story4.html" class="story-btn"><span class="num">4</span>4-րդ պատմություն</a>
    <a href="story5.html" class="story-btn"><span class="num">5</span>5-րդ պատմություն</a>
    <a href="story6.html" class="story-btn"><span class="num">6</span>6-րդ պատմություն</a>
    <a href="story7.html" class="story-btn btn-center"><span class="num">7</span>7-րդ պատմություն</a>
  </nav>

</main>
